name: Doctoral game quality gate
on:
  push:
    paths:
      - 'assets/doctoral-*.js'
      - 'assets/eric-avatar-3d.js'
      - 'jeu/**'
      - '.github/workflows/doctoral-game-quality.yml'
  pull_request:
    paths:
      - 'assets/doctoral-*.js'
      - 'assets/eric-avatar-3d.js'
      - 'jeu/**'
jobs:
  runtime:
    name: Runtime gameplay smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate doctoral career dependency graph
        run: node jeu/verifier-carriere.mjs
      - name: Execute avatar, zones and first interaction
        run: node jeu/test-runtime.mjs
