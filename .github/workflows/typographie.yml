name: Vérifier la charte typographique commune
on: [push, pull_request, workflow_dispatch]
jobs:
  typographie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node outils/harmoniser-typographie.js --check
