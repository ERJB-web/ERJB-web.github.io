<svg xmlns="http://www.w3.org/2000/svg" width="176" height="14" viewBox="0 0 176 14">
  <title>Deux petits chariots métalliques avec galets porteurs</title>
  <defs>
    <linearGradient id="bracket" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#f4f4ec"/>
      <stop offset=".19" stop-color="#c4cbc2"/>
      <stop offset=".52" stop-color="#747d74"/>
      <stop offset=".83" stop-color="#a2aaa1"/>
      <stop offset="1" stop-color="#4b5550"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#5d675e"/><stop offset=".2" stop-color="#cbd0c5"/>
      <stop offset=".5" stop-color="#f0f0e8"/><stop offset=".8" stop-color="#919a90"/>
      <stop offset="1" stop-color="#49534b"/>
    </linearGradient>
    <radialGradient id="wheel" cx=".33" cy=".22" r=".81">
      <stop stop-color="#8a938c"/><stop offset=".26" stop-color="#646e67"/>
      <stop offset=".76" stop-color="#363e3a"/><stop offset="1" stop-color="#1d2622"/>
    </radialGradient>
    <radialGradient id="hub" cx=".31" cy=".23" r=".82">
      <stop stop-color="#fdfdf5"/><stop offset=".37" stop-color="#c5cec6"/>
      <stop offset=".8" stop-color="#626c64"/><stop offset="1" stop-color="#3b453d"/>
    </radialGradient>
    <filter id="shadow" x="-60%" width="220%" y="-130%" height="360%">
      <feGaussianBlur stdDeviation=".78"/>
    </filter>
    <filter id="metalNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8 .42" numOctaves="2" seed="11" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="neutral"/>
      <feComponentTransfer in="neutral"><feFuncA type="linear" slope=".09"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="neutral" mode="multiply"/>
    </filter>
    <g id="bogie">
      <!-- Mounting angle bolted to the underside, with folded lip. -->
      <path d="M3.5 1.1H30.5L32 2.55L30.2 4.6H3.8L2 2.7Z" fill="url(#bracket)" stroke="#515c52" stroke-width=".5" filter="url(#metalNoise)"/>
      <path d="M3.7 1.25H30.2" stroke="#fffdf5" stroke-opacity=".82" stroke-width=".7"/>
      <path d="M4.1 4.5H30.1L28.5 6.4H5.4Z" fill="#5e6a61" opacity=".85"/>
      <path d="M7 4.4V6.4M27 4.4V6.4" stroke="#434d45" stroke-width=".9"/>
      <path d="M9.1 2.75H25.2" stroke="#677269" stroke-opacity=".42" stroke-width=".35"/>
      <!-- Flush-fasteners and subtle tool marks. -->
      <g fill="url(#hub)" stroke="#464f49" stroke-width=".22">
        <circle cx="7.2" cy="2.83" r="1.05"/>
        <circle cx="26.8" cy="2.83" r="1.05"/>
      </g>
      <path d="M6.8 2.8H7.6M26.4 2.8H27.2" stroke="#3b463f" stroke-width=".32"/>
      <!-- Roller itself and pressed stainless axle. -->
      <ellipse cx="17" cy="8.22" rx="7.3" ry="2.2" fill="#313a33" opacity=".23" filter="url(#shadow)"/>
      <circle cx="17" cy="6.07" r="3.67" fill="url(#wheel)" stroke="#252e28" stroke-width=".8"/>
      <path d="M14.8 4.4A3.4 3.4 0 0 1 19.5 4.3" fill="none" stroke="#eef0e9" stroke-width=".48" stroke-opacity=".51"/>
      <circle cx="17" cy="6.07" r="2.06" fill="#a8b1a7" stroke="#49554d" stroke-width=".5"/>
      <circle cx="17" cy="6.07" r="1.51" fill="url(#hub)"/>
      <circle cx="17" cy="6.07" r=".58" fill="#68746b" stroke="#edf1e8" stroke-width=".32"/>
      <path d="M16.55 6.1H17.45" stroke="#4b554d" stroke-width=".24"/>
      <!-- Thin return of the housing, not an oversized toy-wheel holder. -->
      <path d="M9.3 4.5Q8.1 5.6 9.4 7.1M24.8 4.5Q26.1 5.6 24.8 7.1" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
    </g>
  </defs>
  <use href="#bogie" x="1" y="0"/>
  <use href="#bogie" x="141" y="0"/>
</svg>