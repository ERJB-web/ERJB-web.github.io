<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Synthèse de la question, des trois objectifs scientifiques et de leurs devis méthodologiques"><rect width="1600" height="900" fill="#ffffff"/><rect width="1600" height="9" fill="#137f83"/><text x="40" y="35" fill="#12849b" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700"><tspan x="40" dy="0">PROTOCOLE DE RECHERCHE · MÉTHODOLOGIE</tspan></text><text x="40" y="78" fill="#123c4d" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700"><tspan x="40" dy="0">Rappel des objectifs et devis de la thèse</tspan></text><text x="40" y="113" fill="#526e80" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400"><tspan x="40" dy="0">Question : Comment s'organise la réponse intersectorielle aux besoins sociaux et de soins de santé concomitants</tspan></text><text x="40" y="141" fill="#526e80" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400"><tspan x="40" dy="0">des différents profils de personnes aînées vivant à domicile ?</tspan></text><rect x="40" y="158" width="342" height="44" rx="8" fill="#102f3d" stroke="#102f3d" stroke-width="2"/><text x="55" y="186" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700"><tspan x="55" dy="0">OBJECTIF SCIENTIFIQUE</tspan></text><rect x="407" y="158" width="342" height="44" rx="8" fill="#102f3d" stroke="#102f3d" stroke-width="2"/><text x="422" y="186" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700"><tspan x="422" dy="0">DEVIS MÉTHODOLOGIQUE</tspan></text><rect x="774" y="158" width="342" height="44" rx="8" fill="#102f3d" stroke="#102f3d" stroke-width="2"/><text x="789" y="186" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700"><tspan x="789" dy="0">POPULATION ET SOURCES</tspan></text><rect x="1141" y="158" width="419" height="44" rx="8" fill="#102f3d" stroke="#102f3d" stroke-width="2"/><text x="1156" y="186" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700"><tspan x="1156" dy="0">PRODUIT ATTENDU</tspan></text><rect x="40" y="221" width="342" height="164" rx="10" fill="#ebf4fc" stroke="#cfdee4" stroke-width="2"/><rect x="40" y="221" width="5" height="164" rx="2" fill="#428cc1"/><text x="54" y="248" fill="#428cc1" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700"><tspan x="54" dy="0">O1 · Identifier les profils</tspan></text><text x="54" y="276" fill="#284455" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400"><tspan x="54" dy="0">Identifier les profils de personnes</tspan><tspan x="54" dy="21">aînées vivant à domicile et leurs</tspan><tspan x="54" dy="21">besoins sociaux et de soins de</tspan><tspan x="54" dy="21">santé concomitants nécessitant</tspan><tspan x="54" dy="21">une réponse intersectorielle</tspan><tspan x="54" dy="21">en première ligne.</tspan></text><rect x="407" y="221" width="342" height="164" rx="10" fill="#ebf4fc" stroke="#cfdee4" stroke-width="2"/><rect x="407" y="221" width="5" height="164" rx="2" fill="#428cc1"/><text x="421" y="248" fill="#428cc1" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700"><tspan x="421" dy="0">Revue scientifique</tspan></text><text x="421" y="276" fill="#284455" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"><tspan x="421" dy="0">Revue de la littérature</tspan><tspan x="421" dy="21">scientifique pour identifier</tspan><tspan x="421" dy="21">les profils et les besoins</tspan><tspan x="421" dy="21">associés à chacun.</tspan></text><rect x="774" y="221" width="342" height="164" rx="10" fill="#ebf4fc" stroke="#cfdee4" stroke-width="2"/><rect x="774" y="221" width="5" height="164" rx="2" fill="#428cc1"/><text x="788" y="248" fill="#428cc1" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700"><tspan x="788" dy="0">Profils documentés</tspan></text><text x="788" y="276" fill="#284455" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"><tspan x="788" dy="0">Études scientifiques sur</tspan><tspan x="788" dy="21">les personnes aînées</tspan><tspan x="788" dy="21">vivant à domicile avec</tspan><tspan x="788" dy="21">des besoins concomitants.</tspan></text><rect x="1141" y="221" width="419" height="164" rx="10" fill="#ebf4fc" stroke="#cfdee4" stroke-width="2"/><rect x="1141" y="221" width="5" height="164" rx="2" fill="#428cc1"/><text x="1155" y="248" fill="#428cc1" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700"><tspan x="1155" dy="0">Typologie des profils</tspan></text><text x="1155" y="276" fill="#284455" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"><tspan x="1155" dy="0">Profils et domaines de</tspan><tspan x="1155" dy="21">besoins associés, issus</tspan><tspan x="1155" dy="21">des données probantes.</tspan></text><rect x="40" y="403" width="342" height="164" rx="10" fill="#eaf8f7" stroke="#cfdee4" stroke-width="2"/><rect x="40" y="403" width="5" height="164" rx="2" fill="#139895"/><text x="54" y="430" fill="#139895" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700"><tspan x="54" dy="0">O2 · Cartographier les ressources</tspan></text><text x="54" y="458" fill="#284455" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400"><tspan x="54" dy="0">Localiser les ressources</tspan><tspan x="54" dy="21">territoriales mobilisables en</tspan><tspan x="54" dy="21">première ligne et comparer</tspan><tspan x="54" dy="21">leur disponibilité, diversité,</tspan><tspan x="54" dy="21">complémentarité et accessibilité</tspan><tspan x="54" dy="21">entre territoires de CLSC.</tspan></text><rect x="407" y="403" width="342" height="164" rx="10" fill="#eaf8f7" stroke="#cfdee4" stroke-width="2"/><rect x="407" y="403" width="5" height="164" rx="2" fill="#139895"/><text x="421" y="430" fill="#139895" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700"><tspan x="421" dy="0">Étude spatiale</tspan></text><text x="421" y="458" fill="#284455" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"><tspan x="421" dy="0">Étude cartographique et</tspan><tspan x="421" dy="21">spatiale, à l’échelle des</tspan><tspan x="421" dy="21">territoires de CLSC.</tspan></text><rect x="774" y="403" width="342" height="164" rx="10" fill="#eaf8f7" stroke="#cfdee4" stroke-width="2"/><rect x="774" y="403" width="5" height="164" rx="2" fill="#139895"/><text x="788" y="430" fill="#139895" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700"><tspan x="788" dy="0">Ressources territoriales</tspan></text><text x="788" y="458" fill="#284455" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"><tspan x="788" dy="0">Ressources susceptibles</tspan><tspan x="788" dy="21">de répondre aux besoins</tspan><tspan x="788" dy="21">des profils établis en O1.</tspan><tspan x="788" dy="21">Unités spatiales : CLSC.</tspan></text><rect x="1141" y="403" width="419" height="164" rx="10" fill="#eaf8f7" stroke="#cfdee4" stroke-width="2"/><rect x="1141" y="403" width="5" height="164" rx="2" fill="#139895"/><text x="1155" y="430" fill="#139895" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700"><tspan x="1155" dy="0">Atlas territorial</tspan></text><text x="1155" y="458" fill="#284455" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"><tspan x="1155" dy="0">Cartes et comparaison</tspan><tspan x="1155" dy="21">des ressources et de</tspan><tspan x="1155" dy="21">l’accessibilité potentielle.</tspan></text><rect x="40" y="585" width="342" height="164" rx="10" fill="#f0f7ec" stroke="#cfdee4" stroke-width="2"/><rect x="40" y="585" width="5" height="164" rx="2" fill="#659e4e"/><text x="54" y="612" fill="#659e4e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700"><tspan x="54" dy="0">O3 · Analyser les réseaux</tspan></text><text x="54" y="640" fill="#284455" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400"><tspan x="54" dy="0">Étudier les configurations</tspan><tspan x="54" dy="21">organisationnelles des réseaux</tspan><tspan x="54" dy="21">intersectoriels mobilisés</tspan><tspan x="54" dy="21">en première ligne, leur</tspan><tspan x="54" dy="21">composition, leurs relations</tspan><tspan x="54" dy="21">et leur fonctionnement.</tspan></text><rect x="407" y="585" width="342" height="164" rx="10" fill="#f0f7ec" stroke="#cfdee4" stroke-width="2"/><rect x="407" y="585" width="5" height="164" rx="2" fill="#659e4e"/><text x="421" y="612" fill="#659e4e" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700"><tspan x="421" dy="0">Analyse rétrospective</tspan></text><text x="421" y="640" fill="#284455" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"><tspan x="421" dy="0">Analyse rétrospective des</tspan><tspan x="421" dy="21">réseaux sociaux (ARS)</tspan><tspan x="421" dy="21">intersectoriels mobilisés.</tspan></text><rect x="774" y="585" width="342" height="164" rx="10" fill="#f0f7ec" stroke="#cfdee4" stroke-width="2"/><rect x="774" y="585" width="5" height="164" rx="2" fill="#659e4e"/><text x="788" y="612" fill="#659e4e" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700"><tspan x="788" dy="0">Réseaux mobilisés</tspan></text><text x="788" y="640" fill="#284455" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"><tspan x="788" dy="0">Organisations, acteurs et</tspan><tspan x="788" dy="21">relations en première ligne</tspan><tspan x="788" dy="21">dans les territoires de</tspan><tspan x="788" dy="21">CLSC étudiés.</tspan></text><rect x="1141" y="585" width="419" height="164" rx="10" fill="#f0f7ec" stroke="#cfdee4" stroke-width="2"/><rect x="1141" y="585" width="5" height="164" rx="2" fill="#659e4e"/><text x="1155" y="612" fill="#659e4e" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700"><tspan x="1155" dy="0">Configurations des réseaux</tspan></text><text x="1155" y="640" fill="#284455" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"><tspan x="1155" dy="0">Composition, structure</tspan><tspan x="1155" dy="21">relationnelle et modalités</tspan><tspan x="1155" dy="21">de fonctionnement.</tspan></text><rect x="40" y="767" width="1520" height="102" rx="11" fill="#102f3d" stroke="#102f3d" stroke-width="2"/><text x="58" y="799" fill="#84c9ce" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700"><tspan x="58" dy="0">ARTICULATION DES TROIS OBJECTIFS</tspan></text><text x="58" y="826" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"><tspan x="58" dy="0">Profils et besoins associés (O1)  →  ressources territoriales mobilisables (O2)  →  réseaux effectivement étudiés (O3).</tspan></text><text x="58" y="850" fill="#c5dbe4" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400"><tspan x="58" dy="0">La présence de ressources sur un territoire ne démontre pas leur mobilisation ni la coordination des organisations.</tspan></text><text x="1542" y="886" fill="#708794" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400"><tspan x="1542" dy="0">09</tspan></text></svg>