<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Study population"><rect x="0" y="0" width="1600" height="900" rx="0" fill="white"/><text font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#123c4d"><tspan x="80" y="90">Study population</tspan></text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#123c4d"><tspan x="80" y="170">How is the intersectoral response to concurrent social and healthcare needs organized for different profiles of older people living at home?</tspan></text><rect x="80" y="285" width="700" height="235" rx="12" fill="#eaf3fa"/><text font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#123c4d"><tspan x="100" y="330">Study population</tspan></text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#123c4d"><tspan x="100" y="375">Reference: older people living at home with concurrent social</tspan><tspan x="100" y="406">and healthcare needs that may require an intersectoral</tspan><tspan x="100" y="437">response in primary care.</tspan></text><rect x="820" y="285" width="700" height="235" rx="12" fill="#eaf3fa"/><text font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#123c4d"><tspan x="840" y="330">O1</tspan></text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#123c4d"><tspan x="840" y="375">Unit: scientific publications describing these people and their</tspan><tspan x="840" y="406">profiles; no individual recruitment for the review.</tspan></text><rect x="80" y="550" width="700" height="235" rx="12" fill="#eaf7f4"/><text font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#123c4d"><tspan x="100" y="595">O2</tspan></text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#123c4d"><tspan x="100" y="640">Units and sources: geolocated services and delivery sites,</tspan><tspan x="100" y="671">CLSC territories, directories and documented territorial data;</tspan><tspan x="100" y="702">no recruited individuals.</tspan></text><rect x="820" y="550" width="700" height="235" rx="12" fill="#f0f7e9"/><text font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#123c4d"><tspan x="840" y="595">O3</tspan></text><text font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#123c4d"><tspan x="840" y="640">Reference: organizations mobilized in primary care around profiles</tspan><tspan x="840" y="669">of older people living at home across several contrasting CLSC</tspan><tspan x="840" y="698">territories. Units: organizations and interorganizational ties; actors</tspan><tspan x="840" y="727">report for their organization. Older people define need profiles, not</tspan><tspan x="840" y="756">network nodes.</tspan></text></svg>