<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Исследуемая совокупность"><rect x="0" y="0" width="1600" height="900" rx="0" fill="white"/><text font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#123c4d"><tspan x="80" y="90">Исследуемая совокупность</tspan></text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#123c4d"><tspan x="80" y="170">Как организуется межсекторальный ответ на одновременно возникающие социальные потребности и потребности в медицинской</tspan><tspan x="80" y="200">помощи различных профилей пожилых людей, живущих дома?</tspan></text><rect x="80" y="285" width="700" height="235" rx="12" fill="#eaf3fa"/><text font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#123c4d"><tspan x="100" y="330">Исследуемая совокупность</tspan></text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#123c4d"><tspan x="100" y="375">Референтная группа: пожилые люди, живущие дома, с</tspan><tspan x="100" y="406">сочетанными социальными потребностями и</tspan><tspan x="100" y="437">потребностями в медицинской помощи, требующими</tspan><tspan x="100" y="468">межсекторального ответа в первичном звене.</tspan></text><rect x="820" y="285" width="700" height="235" rx="12" fill="#eaf3fa"/><text font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#123c4d"><tspan x="840" y="330">O1</tspan></text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#123c4d"><tspan x="840" y="375">Единица: научные публикации об этих людях и их</tspan><tspan x="840" y="406">профилях; индивидуальные участники для обзора не</tspan><tspan x="840" y="437">набираются.</tspan></text><rect x="80" y="550" width="700" height="235" rx="12" fill="#eaf7f4"/><text font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#123c4d"><tspan x="100" y="595">O2</tspan></text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#123c4d"><tspan x="100" y="640">Единицы и источники: геокодированные услуги и места</tspan><tspan x="100" y="671">оказания, территории CLSC, справочники и</tspan><tspan x="100" y="702">документированные территориальные данные; без набора</tspan><tspan x="100" y="733">людей.</tspan></text><rect x="820" y="550" width="700" height="235" rx="12" fill="#f0f7e9"/><text font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#123c4d"><tspan x="840" y="595">O3</tspan></text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#123c4d"><tspan x="840" y="640">Объект: организации первичного звена, задействованные для</tspan><tspan x="840" y="666">профилей пожилых людей дома, в нескольких контрастных</tspan><tspan x="840" y="692">территориях CLSC. Единицы: организации и межорганизационные</tspan><tspan x="840" y="718">связи; сотрудники отвечают от имени организации. Пожилые люди</tspan><tspan x="840" y="744">определяют профили потребностей, а не узлы сети.</tspan></text></svg>