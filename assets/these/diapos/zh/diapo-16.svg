<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="开展从多个CLSC辖区出发、在基层医疗中动员的跨部门社会网络回顾性分析，以回应居家老年人不同类型的并存社会与医疗照护需求，描述网络的组成、关系结构以及行动者之间合作的性质与强度。"><rect x="0" y="0" width="1600" height="900" rx="0" fill="white"/><text font-family="SimSun, sans-serif" font-size="28" font-weight="700" fill="#18559b"><tspan x="80" y="70">方法目标3</tspan></text><text font-family="SimSun, sans-serif" font-size="25" font-weight="400" fill="#123c4d"><tspan x="80" y="122">开展从多个CLSC辖区出发、在基层医疗中动员的跨部门社会网络回顾性分析，以回应居家老年人不同类型的并存社会与医疗照护需</tspan><tspan x="80" y="154">求，描述网络的组成、关系结构以及行动者之间合作的性质与强度。</tspan></text><rect x="80" y="310" width="1440" height="165" rx="10" fill="#f1f6fc"/><text font-family="SimSun, sans-serif" font-size="23" font-weight="400" fill="#123c4d"><tspan x="100" y="345">工具：一次性关系问卷，回顾过去12个月；辅以少量开放题，不另</tspan><tspan x="100" y="375">行开展访谈。</tspan></text><text font-family="SimSun, sans-serif" font-size="23" font-weight="400" fill="#123c4d"><tspan x="815" y="345">关系：合作组织、转介、信息交换、协调和共同决策；记录方向、</tspan><tspan x="815" y="375">频率、自报互惠及涉及的需求类型。</tspan></text><rect x="80" y="495" width="1440" height="165" rx="10" fill="#f1f6fc"/><text font-family="SimSun, sans-serif" font-size="23" font-weight="400" fill="#123c4d"><tspan x="100" y="530">按类型分析整体网络：收集各辖区界定范围内所有组织间的关系，</tspan><tspan x="100" y="560">依据覆盖程度分析组成、结构与运作。</tspan></text><text font-family="SimSun, sans-serif" font-size="23" font-weight="400" fill="#123c4d"><tspan x="815" y="530">自我中心网络：以包括CLSC在内的组织或团队为中心，分析规模、</tspan><tspan x="815" y="560">多样性及ego–alter关系；alter–alter关系须专门采集。</tspan></text><rect x="80" y="680" width="1440" height="165" rx="10" fill="#f1f6fc"/><text font-family="SimSun, sans-serif" font-size="23" font-weight="400" fill="#123c4d"><tspan x="100" y="715">设计：定量观察性、描述性和比较性研究；一次横断面采集，回顾1</tspan><tspan x="100" y="745">2个月，不分配干预。</tspan></text><text font-family="SimSun, sans-serif" font-size="23" font-weight="400" fill="#123c4d"><tspan x="815" y="715">衔接：两个网络层次使用同一问卷；开放题用于补充解释，不采用</tspan><tspan x="815" y="745">序贯或汇聚式混合方法设计。</tspan></text></svg>