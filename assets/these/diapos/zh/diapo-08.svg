<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="研究人群"><rect x="0" y="0" width="1600" height="900" rx="0" fill="white"/><text font-family="SimSun, sans-serif" font-size="38" font-weight="700" fill="#123c4d"><tspan x="80" y="90">研究人群</tspan></text><text font-family="SimSun, sans-serif" font-size="23" font-weight="400" fill="#123c4d"><tspan x="80" y="170">如何组织跨部门响应，以满足居家老年人不同特征类型同时存在的社会需求和医疗照护需求？</tspan></text><rect x="80" y="285" width="700" height="235" rx="12" fill="#eaf3fa"/><text font-family="SimSun, sans-serif" font-size="25" font-weight="700" fill="#123c4d"><tspan x="100" y="330">研究人群</tspan></text><text font-family="SimSun, sans-serif" font-size="24" font-weight="400" fill="#123c4d"><tspan x="100" y="375">参照人群：居家老年人，同时存在社会需求和医疗照护需求，</tspan><tspan x="100" y="406">可能需要基层医疗中的跨部门响应。</tspan></text><rect x="820" y="285" width="700" height="235" rx="12" fill="#eaf3fa"/><text font-family="SimSun, sans-serif" font-size="25" font-weight="700" fill="#123c4d"><tspan x="840" y="330">O1</tspan></text><text font-family="SimSun, sans-serif" font-size="24" font-weight="400" fill="#123c4d"><tspan x="840" y="375">研究单位：描述这些人及其特征类型的科学文献；综述不招募</tspan><tspan x="840" y="406">个人参与者。</tspan></text><rect x="80" y="550" width="700" height="235" rx="12" fill="#eaf7f4"/><text font-family="SimSun, sans-serif" font-size="25" font-weight="700" fill="#123c4d"><tspan x="100" y="595">O2</tspan></text><text font-family="SimSun, sans-serif" font-size="24" font-weight="400" fill="#123c4d"><tspan x="100" y="640">单位与来源：地理定位的服务与提供地点、CLSC辖区、名录和</tspan><tspan x="100" y="671">有记录的地区数据；不招募个人。</tspan></text><rect x="820" y="550" width="700" height="235" rx="12" fill="#f0f7e9"/><text font-family="SimSun, sans-serif" font-size="25" font-weight="700" fill="#123c4d"><tspan x="840" y="595">O3</tspan></text><text font-family="SimSun, sans-serif" font-size="24" font-weight="400" fill="#123c4d"><tspan x="840" y="640">研究对象：在多个具有差异的CLSC辖区内，围绕居家老年人需</tspan><tspan x="840" y="671">求类型在基层医疗中动员的组织。分析单位：组织及组织间关</tspan><tspan x="840" y="702">系；相关人员代表组织填答。老年人用于界定需求类型，并非</tspan><tspan x="840" y="733">网络节点。</tspan></text></svg>