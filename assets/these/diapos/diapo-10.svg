<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" role="img" aria-label="Objectifs spécifiques et devis de la thèse"><rect width="2400" height="1350" fill="white"/><text fill="#18788a" font-family="Arial, sans-serif" font-size="22" font-weight="700"><tspan x="100" y="65">PROTOCOLE DE RECHERCHE · MÉTHODOLOGIE</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="46" font-weight="700"><tspan x="100" y="165">Objectifs spécifiques et devis de la thèse</tspan></text><text fill="#607781" font-family="Arial, sans-serif" font-size="21" font-weight="400"><tspan x="100" y="1290">Éric Bernier · Formulations approuvées · 21 octobre 2026</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="21" font-weight="400"><tspan x="2250" y="1290">10</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="100" y="255">Comment s&#x27;organise la réponse intersectorielle aux besoins sociaux et de soins de santé concomitants des différents profils de personnes aînées vivant à domicile ?</tspan></text><rect x="100" y="340" width="990" height="75" rx="14" fill="#123c4d" stroke="none" stroke-width="2"/><text fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700"><tspan x="118" y="388">OBJECTIF SPÉCIFIQUE</tspan></text><rect x="1120" y="340" width="360" height="75" rx="14" fill="#123c4d" stroke="none" stroke-width="2"/><text fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700"><tspan x="1138" y="388">DEVIS</tspan></text><rect x="1510" y="340" width="400" height="75" rx="14" fill="#123c4d" stroke="none" stroke-width="2"/><text fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700"><tspan x="1528" y="388">POPULATION ET SOURCES</tspan></text><rect x="1940" y="340" width="360" height="75" rx="14" fill="#123c4d" stroke="none" stroke-width="2"/><text fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700"><tspan x="1958" y="388">PRODUIT ATTENDU</tspan></text><rect x="100" y="440" width="990" height="225" rx="14" fill="#eaf3fa" stroke="#c6d9df" stroke-width="2"/><rect x="1120" y="440" width="360" height="225" rx="14" fill="#eaf3fa" stroke="#c6d9df" stroke-width="2"/><rect x="1510" y="440" width="400" height="225" rx="14" fill="#eaf3fa" stroke="#c6d9df" stroke-width="2"/><rect x="1940" y="440" width="360" height="225" rx="14" fill="#eaf3fa" stroke="#c6d9df" stroke-width="2"/><text fill="#0879be" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="120" y="480">O1</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="120" y="510">Identifier les différents profils de personnes aînées vivant à domicile présentant des</tspan><tspan x="120" y="544">besoins sociaux et de soins de santé concomitants susceptibles de nécessiter une</tspan><tspan x="120" y="578">réponse intersectorielle dans le contexte des soins primaires.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1140" y="480">Revue de portée (JBI,</tspan><tspan x="1140" y="514">PRISMA-ScR) et analyse</tspan><tspan x="1140" y="548">descriptive des demandes</tspan><tspan x="1140" y="582">au 211.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1530" y="480">Études sur les 65 ans et plus à</tspan><tspan x="1530" y="514">domicile ayant une ou plusieurs</tspan><tspan x="1530" y="548">morbidités ; demandes au 211</tspan><tspan x="1530" y="582">des 60 ans et plus.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1960" y="480">Typologie des profils de</tspan><tspan x="1960" y="514">besoins concomitants,</tspan><tspan x="1960" y="548">traduite en vignettes.</tspan></text><rect x="100" y="685" width="990" height="225" rx="14" fill="#eaf7f4" stroke="#c6d9df" stroke-width="2"/><rect x="1120" y="685" width="360" height="225" rx="14" fill="#eaf7f4" stroke="#c6d9df" stroke-width="2"/><rect x="1510" y="685" width="400" height="225" rx="14" fill="#eaf7f4" stroke="#c6d9df" stroke-width="2"/><rect x="1940" y="685" width="360" height="225" rx="14" fill="#eaf7f4" stroke="#c6d9df" stroke-width="2"/><text fill="#078786" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="120" y="725">O2</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="120" y="755">Cartographier les ressources territoriales susceptibles de répondre aux besoins</tspan><tspan x="120" y="789">sociaux et de soins de santé concomitants des différents profils de personnes</tspan><tspan x="120" y="823">aînées vivant à domicile, et caractériser les variations territoriales de leur</tspan><tspan x="120" y="857">disponibilité, de leur diversité, de leur complémentarité et de leur accessibilité.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1140" y="725">Quantitatif observationnel</tspan><tspan x="1140" y="759">écologique : données</tspan><tspan x="1140" y="793">secondaires, analyse</tspan><tspan x="1140" y="827">spatiale.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1530" y="725">8 territoires de CLSC du</tspan><tspan x="1530" y="759">CCSMTL ; 7 216 lieux de</tspan><tspan x="1530" y="793">service des six secteurs ; aînés</tspan><tspan x="1530" y="827">de 65 ans et plus.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1960" y="725">Atlas par CLSC, matrice</tspan><tspan x="1960" y="759">besoins × ressources ×</tspan><tspan x="1960" y="793">territoire, indice d’écart.</tspan></text><rect x="100" y="930" width="990" height="225" rx="14" fill="#f0f7e9" stroke="#c6d9df" stroke-width="2"/><rect x="1120" y="930" width="360" height="225" rx="14" fill="#f0f7e9" stroke="#c6d9df" stroke-width="2"/><rect x="1510" y="930" width="400" height="225" rx="14" fill="#f0f7e9" stroke="#c6d9df" stroke-width="2"/><rect x="1940" y="930" width="360" height="225" rx="14" fill="#f0f7e9" stroke="#c6d9df" stroke-width="2"/><text fill="#568e2d" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="120" y="970">O3</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="120" y="1000">Analyser les configurations organisationnelles des réseaux intersectoriels</tspan><tspan x="120" y="1034">mobilisés sur le territoire pour répondre aux besoins sociaux et de soins de santé</tspan><tspan x="120" y="1068">concomitants des différents profils de personnes aînées vivant à domicile, afin de</tspan><tspan x="120" y="1102">caractériser leurs modalités de fonctionnement.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1140" y="970">Mixte séquentiel explicatif</tspan><tspan x="1140" y="1004">(QUAN → qual) : analyse</tspan><tspan x="1140" y="1038">de réseaux égocentrée,</tspan><tspan x="1140" y="1072">puis entretiens.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1530" y="970">Équipes SAD du CIUSSS</tspan><tspan x="1530" y="1004">(egos) et organisations</tspan><tspan x="1530" y="1038">partenaires de 3 ou 4 CLSC</tspan><tspan x="1530" y="1072">contrastés.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1960" y="970">Réseau par CLSC et par</tspan><tspan x="1960" y="1004">profil : acteurs, niveaux de</tspan><tspan x="1960" y="1038">collaboration, maillons</tspan><tspan x="1960" y="1072">manquants.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="100" y="1230">Posture pragmatique · méthodes mixtes multiphases (Creswell et Plano Clark, 2017) : O1 → O2 → O3 · un ou plusieurs patients partenaires associés à toutes les étapes.</tspan></text></svg>