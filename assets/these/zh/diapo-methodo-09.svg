<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" role="img" aria-label="具体目标 · 方法目标"><rect x="0" y="0" width="2400" height="1350" rx="0" fill="white"/><text font-family="SimSun, sans-serif" font-size="44" font-weight="700" fill="#123c4d"><tspan x="100" y="110">具体目标·方法目标</tspan></text><text font-family="SimSun, sans-serif" font-size="29" font-weight="400" fill="#123c4d"><tspan x="100" y="215">如何组织跨部门响应，以满足居家老年人不同特征类型同时存在的社会需求和医疗照护需求？</tspan></text><rect x="100" y="315" width="1085" height="75" rx="12" fill="#123c4d"/><text font-family="SimSun, sans-serif" font-size="28" font-weight="700" fill="white"><tspan x="120" y="365">具体目标</tspan></text><rect x="1215" y="315" width="1085" height="75" rx="12" fill="#123c4d"/><text font-family="SimSun, sans-serif" font-size="28" font-weight="700" fill="white"><tspan x="1235" y="365">方法目标</tspan></text><rect x="100" y="410" width="1085" height="250" rx="12" fill="#eaf3fa"/><text font-family="SimSun, sans-serif" font-size="27" font-weight="700" fill="#286c23"><tspan x="120" y="445">O1</tspan></text><text font-family="SimSun, sans-serif" font-size="27" font-weight="400" fill="#123c4d"><tspan x="120" y="482">识别居家老年人的不同特征类型：这些人同时存在社会需求和医疗照护需求，可能需要</tspan><tspan x="120" y="517">在基层医疗中获得跨部门响应。</tspan></text><rect x="1215" y="410" width="1085" height="250" rx="12" fill="#eaf3fa"/><text font-family="SimSun, sans-serif" font-size="27" font-weight="700" fill="#286c23"><tspan x="1235" y="445">O1</tspan></text><text font-family="SimSun, sans-serif" font-size="27" font-weight="400" fill="#123c4d"><tspan x="1235" y="482">开展科学文献综述，以识别和描述居家老年人的不同特征类型：这些人同时存在社会需</tspan><tspan x="1235" y="517">求和医疗照护需求，可能需要在基层医疗中获得跨部门响应；并确定每种特征类型对应</tspan><tspan x="1235" y="552">的需求。</tspan></text><rect x="100" y="680" width="1085" height="250" rx="12" fill="#eaf7f4"/><text font-family="SimSun, sans-serif" font-size="27" font-weight="700" fill="#006e72"><tspan x="120" y="715">O2</tspan></text><text font-family="SimSun, sans-serif" font-size="27" font-weight="400" fill="#123c4d"><tspan x="120" y="752">绘制可能在基层医疗中动员、以满足居家老年人不同特征类型同时存在的社会需求和医</tspan><tspan x="120" y="787">疗照护需求的地区资源，并描述其可用性、多样性、互补性和可及性的地区差异。</tspan></text><rect x="1215" y="680" width="1085" height="250" rx="12" fill="#eaf7f4"/><text font-family="SimSun, sans-serif" font-size="27" font-weight="700" fill="#006e72"><tspan x="1235" y="715">O2</tspan></text><text font-family="SimSun, sans-serif" font-size="27" font-weight="400" fill="#123c4d"><tspan x="1235" y="752">对基层医疗中可动员的资源开展制图与空间研究，以回应居家老年人特征类型所对应的</tspan><tspan x="1235" y="787">不同并存社会需求和医疗照护需求，并描述这些资源在不同CLSC辖区的分布、可用性、</tspan><tspan x="1235" y="822">多样性、互补性和地区可及性。</tspan></text><rect x="100" y="950" width="1085" height="250" rx="12" fill="#f0f7e9"/><text font-family="SimSun, sans-serif" font-size="27" font-weight="700" fill="#18559b"><tspan x="120" y="985">O3</tspan></text><text font-family="SimSun, sans-serif" font-size="27" font-weight="400" fill="#123c4d"><tspan x="120" y="1022">分析基层医疗中为满足居家老年人不同特征类型同时存在的社会需求和医疗照护需求而</tspan><tspan x="120" y="1057">在地区内动员的跨部门网络的组织配置，以描述其运作方式。</tspan></text><rect x="1215" y="950" width="1085" height="250" rx="12" fill="#f0f7e9"/><text font-family="SimSun, sans-serif" font-size="27" font-weight="700" fill="#18559b"><tspan x="1235" y="985">O3</tspan></text><text font-family="SimSun, sans-serif" font-size="27" font-weight="400" fill="#123c4d"><tspan x="1235" y="1022">开展从多个CLSC辖区出发、在基层医疗中动员的跨部门社会网络回顾性分析，以回应居</tspan><tspan x="1235" y="1057">家老年人不同类型的并存社会与医疗照护需求，描述网络的组成、关系结构以及行动者</tspan><tspan x="1235" y="1092">之间合作的性质与强度。</tspan></text><text font-family="SimSun, sans-serif" font-size="21" font-weight="400" fill="#607781"><tspan x="100" y="1290">ÉricBernier·21octobre2026</tspan></text></svg>