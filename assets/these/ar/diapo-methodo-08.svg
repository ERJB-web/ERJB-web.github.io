<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="مجتمع الدراسة"><rect x="0" y="0" width="1600" height="900" rx="0" fill="white"/><text font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#123c4d" direction="rtl" unicode-bidi="plaintext"><tspan x="1520" y="90">مجتمع الدراسة</tspan></text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#123c4d" direction="rtl" unicode-bidi="plaintext"><tspan x="1520" y="170">كيف تُنظَّم الاستجابة المشتركة بين القطاعات للاحتياجات الاجتماعية واحتياجات الرعاية الصحية المتزامنة لمختلف أنماط كبار السن الذين يعيشون في</tspan><tspan x="1520" y="200">منازلهم؟</tspan></text><rect x="80" y="285" width="700" height="235" rx="12" fill="#eaf3fa"/><text font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#123c4d" direction="rtl" unicode-bidi="plaintext"><tspan x="760" y="330">مجتمع الدراسة</tspan></text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#123c4d" direction="rtl" unicode-bidi="plaintext"><tspan x="760" y="375">المرجع: كبار السن في منازلهم ذوو احتياجات اجتماعية ورعاية صحية</tspan><tspan x="760" y="406">متزامنة قد تستلزم استجابة بين القطاعات في الرعاية الأولية.</tspan></text><rect x="820" y="285" width="700" height="235" rx="12" fill="#eaf3fa"/><text font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#123c4d" direction="rtl" unicode-bidi="plaintext"><tspan x="1500" y="330">O1</tspan></text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#123c4d" direction="rtl" unicode-bidi="plaintext"><tspan x="1500" y="375">الوحدة: منشورات علمية تصف هؤلاء الأشخاص وأنماطهم؛ لا تجنيد</tspan><tspan x="1500" y="406">لأشخاص في المراجعة.</tspan></text><rect x="80" y="550" width="700" height="235" rx="12" fill="#eaf7f4"/><text font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#123c4d" direction="rtl" unicode-bidi="plaintext"><tspan x="760" y="595">O2</tspan></text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#123c4d" direction="rtl" unicode-bidi="plaintext"><tspan x="760" y="640">الوحدات والمصادر: خدمات ومواقع تقديم محددة جغرافياً ومناطق CLSC</tspan><tspan x="760" y="671">وأدلة وبيانات محلية موثقة؛ دون تجنيد أفراد.</tspan></text><rect x="820" y="550" width="700" height="235" rx="12" fill="#f0f7e9"/><text font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#123c4d" direction="rtl" unicode-bidi="plaintext"><tspan x="1500" y="595">O3</tspan></text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#123c4d" direction="rtl" unicode-bidi="plaintext"><tspan x="1500" y="640">المرجع: المنظمات المعبأة في الرعاية الأولية حول أنماط كبار السن</tspan><tspan x="1500" y="671">في منازلهم، في عدة مناطق CLSC متباينة. الوحدات: المنظمات</tspan><tspan x="1500" y="702">والعلاقات بينها؛ يجيب الفاعلون عن منظماتهم. يحدد كبار السن</tspan><tspan x="1500" y="733">أنماط الاحتياجات وليس عقد الشبكة.</tspan></text></svg>