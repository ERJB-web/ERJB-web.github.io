<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" role="img" aria-label="Synthèse des objectifs et approches méthodologiques"><rect width="2400" height="1350" fill="white"/><text fill="#18788a" font-family="Arial, sans-serif" font-size="22" font-weight="700"><tspan x="100" y="65">PROTOCOLE DE RECHERCHE · MÉTHODOLOGIE</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="46" font-weight="700"><tspan x="100" y="165">Synthèse des objectifs et approches méthodologiques</tspan></text><text fill="#607781" font-family="Arial, sans-serif" font-size="21" font-weight="400"><tspan x="100" y="1290">Éric Bernier · Synthèse des orientations du protocole doctoral</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="21" font-weight="400"><tspan x="2250" y="1290">10</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="100" y="255">Comment s&#x27;organise la réponse intersectorielle aux besoins sociaux et de soins de santé concomitants des différents profils de personnes aînées vivant à domicile ?</tspan></text><rect x="100" y="340" width="990" height="75" rx="14" fill="#123c4d" stroke="none" stroke-width="2"/><text fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700"><tspan x="118" y="388">OBJECTIF SPÉCIFIQUE</tspan></text><rect x="1120" y="340" width="360" height="75" rx="14" fill="#123c4d" stroke="none" stroke-width="2"/><text fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700"><tspan x="1138" y="388">DEVIS</tspan></text><rect x="1510" y="340" width="400" height="75" rx="14" fill="#123c4d" stroke="none" stroke-width="2"/><text fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700"><tspan x="1528" y="388">POPULATION ET SOURCES</tspan></text><rect x="1940" y="340" width="360" height="75" rx="14" fill="#123c4d" stroke="none" stroke-width="2"/><text fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700"><tspan x="1958" y="388">PRODUIT ATTENDU</tspan></text><rect x="100" y="440" width="990" height="225" rx="14" fill="#eaf3fa" stroke="#c6d9df" stroke-width="2"/><rect x="1120" y="440" width="360" height="225" rx="14" fill="#eaf3fa" stroke="#c6d9df" stroke-width="2"/><rect x="1510" y="440" width="400" height="225" rx="14" fill="#eaf3fa" stroke="#c6d9df" stroke-width="2"/><rect x="1940" y="440" width="360" height="225" rx="14" fill="#eaf3fa" stroke="#c6d9df" stroke-width="2"/><text fill="#0879be" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="120" y="480">O1</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="120" y="510">Identifier les profils de personnes aînées vivant à</tspan><tspan x="120" y="544">domicile présentant des besoins sociaux et de</tspan><tspan x="120" y="578">soins de santé concomitants nécessitant une</tspan><tspan x="120" y="612">réponse intersectorielle en première ligne.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1140" y="480">Revue de la</tspan><tspan x="1140" y="514">littérature scientifique :</tspan><tspan x="1140" y="548">profils de besoins</tspan><tspan x="1140" y="582">concomitants.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1530" y="480">Études sur les personnes</tspan><tspan x="1530" y="514">aînées vivant à domicile</tspan><tspan x="1530" y="548">et leurs différents</tspan><tspan x="1530" y="582">besoins concomitants.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1960" y="480">Profils de besoins</tspan><tspan x="1960" y="514">concomitants et</tspan><tspan x="1960" y="548">besoins associés.</tspan></text><rect x="100" y="685" width="990" height="225" rx="14" fill="#eaf7f4" stroke="#c6d9df" stroke-width="2"/><rect x="1120" y="685" width="360" height="225" rx="14" fill="#eaf7f4" stroke="#c6d9df" stroke-width="2"/><rect x="1510" y="685" width="400" height="225" rx="14" fill="#eaf7f4" stroke="#c6d9df" stroke-width="2"/><rect x="1940" y="685" width="360" height="225" rx="14" fill="#eaf7f4" stroke="#c6d9df" stroke-width="2"/><text fill="#078786" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="120" y="725">O2</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="120" y="755">Cartographier les ressources mobilisables en</tspan><tspan x="120" y="789">première ligne pour répondre aux besoins</tspan><tspan x="120" y="823">sociaux et de soins de santé concomitants ;</tspan><tspan x="120" y="857">comparer leur disponibilité, diversité,</tspan><tspan x="120" y="891">complémentarité et accessibilité territoriale.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1140" y="725">Étude cartographique</tspan><tspan x="1140" y="759">et analyse spatiale :</tspan><tspan x="1140" y="793">ressources mobilisables</tspan><tspan x="1140" y="827">en première ligne.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1530" y="725">Territoires de CLSC ;</tspan><tspan x="1530" y="759">ressources de différents</tspan><tspan x="1530" y="793">secteurs mobilisables</tspan><tspan x="1530" y="827">en première ligne.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1960" y="725">Cartes par CLSC,</tspan><tspan x="1960" y="759">comparaisons des</tspan><tspan x="1960" y="793">ressources et de leur</tspan><tspan x="1960" y="827">accessibilité potentielle.</tspan></text><rect x="100" y="930" width="990" height="225" rx="14" fill="#f0f7e9" stroke="#c6d9df" stroke-width="2"/><rect x="1120" y="930" width="360" height="225" rx="14" fill="#f0f7e9" stroke="#c6d9df" stroke-width="2"/><rect x="1510" y="930" width="400" height="225" rx="14" fill="#f0f7e9" stroke="#c6d9df" stroke-width="2"/><rect x="1940" y="930" width="360" height="225" rx="14" fill="#f0f7e9" stroke="#c6d9df" stroke-width="2"/><text fill="#568e2d" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="120" y="970">O3</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="120" y="1000">Analyser les configurations des réseaux</tspan><tspan x="120" y="1034">intersectoriels mobilisés en première ligne</tspan><tspan x="120" y="1068">pour différents profils de personnes aînées :</tspan><tspan x="120" y="1102">composition, relations et fonctionnement.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1140" y="970">Analyse rétrospective</tspan><tspan x="1140" y="1004">des réseaux sociaux</tspan><tspan x="1140" y="1038">intersectoriels (ARS)</tspan><tspan x="1140" y="1072">mobilisés.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1530" y="970">Organisations et réseaux</tspan><tspan x="1530" y="1004">mobilisés en première</tspan><tspan x="1530" y="1038">ligne dans les territoires</tspan><tspan x="1530" y="1072">de CLSC étudiés.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1960" y="970">Configurations étudiées :</tspan><tspan x="1960" y="1004">composition, structure</tspan><tspan x="1960" y="1038">des relations et modalités</tspan><tspan x="1960" y="1072">de fonctionnement.</tspan></text><text fill="#123c4d" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="100" y="1230">O1 : revue scientifique  ·  O2 : cartographie et analyse spatiale  ·  O3 : analyse rétrospective des réseaux intersectoriels.</tspan></text></svg>