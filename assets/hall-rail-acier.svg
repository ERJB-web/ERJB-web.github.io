<svg xmlns="http://www.w3.org/2000/svg" width="640" height="18" viewBox="0 0 640 18">
  <title>Profilé encastré en acier inoxydable satiné</title>
  <defs>
    <linearGradient id="chan" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5f3e9" stop-opacity=".52"/>
      <stop offset=".18" stop-color="#9a9d92" stop-opacity=".68"/>
      <stop offset=".35" stop-color="#4c544d" stop-opacity=".93"/>
      <stop offset=".61" stop-color="#2c332f" stop-opacity=".96"/>
      <stop offset=".80" stop-color="#888e83" stop-opacity=".89"/>
      <stop offset="1" stop-color="#e6e3d7" stop-opacity=".90"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fdfaf0" stop-opacity=".72"/>
      <stop offset=".48" stop-color="#d1cfc4" stop-opacity=".82"/>
      <stop offset="1" stop-color="#777e75" stop-opacity=".66"/>
    </linearGradient>
    <linearGradient id="pit" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#464f47"/><stop offset=".55" stop-color="#9ca49a"/><stop offset="1" stop-color="#eceadf"/>
    </linearGradient>
    <filter id="soft" x="-10%" width="120%" y="-180%" height="460%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="grain" x="0" y="-100%" width="100%" height="300%">
      <feTurbulence type="fractalNoise" baseFrequency=".65 .19" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint">
        <feFuncA type="linear" slope=".13"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
  </defs>
  <!-- The translucent margins let the original stone floor stay visible. -->
  <path d="M0 9H640" stroke="#4a5047" stroke-opacity=".18" stroke-width="8" filter="url(#soft)"/>
  <path d="M0 6.75H640" stroke="#fffdf5" stroke-opacity=".66" stroke-width=".8"/>
  <path d="M0 7.55H640" stroke="#777e72" stroke-opacity=".52" stroke-width=".7"/>
  <path d="M0 8.10H640V11.75H0Z" fill="url(#chan)" filter="url(#grain)"/>
  <path d="M0 9.05H640" stroke="#212823" stroke-width=".72" stroke-opacity=".8"/>
  <path d="M0 10.13H640" stroke="#b8bfb3" stroke-width=".47" stroke-opacity=".45"/>
  <path d="M0 11.65H640" stroke="url(#strip)" stroke-width=".7"/>
  <path d="M0 12.23H640" stroke="#403f36" stroke-opacity=".12" stroke-width=".6"/>
  <!-- Shallow flush-set assembly screws, every ~160 pixels. -->
  <g>
    <g transform="translate(80 9.74)">
      <ellipse rx="3.7" ry="1.35" fill="#373c36" opacity=".32"/>
      <ellipse rx="2.6" ry="1.07" fill="url(#pit)" opacity=".67"/>
      <path d="M-1.35-.16L1.35.18" stroke="#404943" stroke-width=".55" opacity=".7"/>
      <path d="M-1.4-.78L.4-.94" stroke="#fff" stroke-opacity=".38" stroke-width=".45"/>
    </g>
    <g transform="translate(240 9.74)">
      <ellipse rx="3.7" ry="1.35" fill="#373c36" opacity=".32"/>
      <ellipse rx="2.6" ry="1.07" fill="url(#pit)" opacity=".67"/>
      <path d="M-1.35-.16L1.35.18" stroke="#404943" stroke-width=".55" opacity=".7"/>
      <path d="M-1.4-.78L.4-.94" stroke="#fff" stroke-opacity=".38" stroke-width=".45"/>
    </g>
    <g transform="translate(400 9.74)">
      <ellipse rx="3.7" ry="1.35" fill="#373c36" opacity=".32"/>
      <ellipse rx="2.6" ry="1.07" fill="url(#pit)" opacity=".67"/>
      <path d="M-1.35-.16L1.35.18" stroke="#404943" stroke-width=".55" opacity=".7"/>
      <path d="M-1.4-.78L.4-.94" stroke="#fff" stroke-opacity=".38" stroke-width=".45"/>
    </g>
    <g transform="translate(560 9.74)">
      <ellipse rx="3.7" ry="1.35" fill="#373c36" opacity=".32"/>
      <ellipse rx="2.6" ry="1.07" fill="url(#pit)" opacity=".67"/>
      <path d="M-1.35-.16L1.35.18" stroke="#404943" stroke-width=".55" opacity=".7"/>
      <path d="M-1.4-.78L.4-.94" stroke="#fff" stroke-opacity=".38" stroke-width=".45"/>
    </g>
  </g>
</svg>