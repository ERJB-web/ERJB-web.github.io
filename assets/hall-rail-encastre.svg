<svg xmlns="http://www.w3.org/2000/svg" width="640" height="8" viewBox="0 0 640 8">
  <title>Rail inox fin affleurant au dallage</title>
  <defs>
    <linearGradient id="inox" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e9e5da" stop-opacity=".75"/>
      <stop offset=".2" stop-color="#b8b6aa" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#82877d" stop-opacity=".84"/>
      <stop offset=".72" stop-color="#c8c8bc" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ede9dc" stop-opacity=".64"/>
    </linearGradient>
    <linearGradient id="reflet" x1="0" x2="1">
      <stop stop-color="#fffbed" stop-opacity=".04"/>
      <stop offset=".28" stop-color="#fffbed" stop-opacity=".3"/>
      <stop offset=".58" stop-color="#fffbed" stop-opacity=".1"/>
      <stop offset=".83" stop-color="#fffbed" stop-opacity=".24"/>
      <stop offset="1" stop-color="#fffbed" stop-opacity=".04"/>
    </linearGradient>
  </defs>
  <!-- Usinage mince, lumière chaude du hall et gorge sombre en retrait. -->
  <path d="M0 5.4H640" stroke="#393d32" stroke-opacity=".1" stroke-width="1.3"/>
  <path fill="url(#inox)" d="M0 2H640V5.2H0Z"/>
  <path d="M0 2.15H640" stroke="#fffcef" stroke-opacity=".48" stroke-width=".45"/>
  <path d="M0 3.55H640" stroke="#333d33" stroke-opacity=".68" stroke-width=".7"/>
  <path d="M0 4.2H640" stroke="#ebebdf" stroke-opacity=".38" stroke-width=".35"/>
  <path d="M0 2.85H640M0 4.65H640" stroke="#646b61" stroke-opacity=".12" stroke-width=".2"/>
  <path fill="url(#reflet)" d="M0 2H640V5H0Z"/>
  <!-- Têtes fraisées à peine perceptibles ; aucune roulette en saillie. -->
  <g fill="#92998d" fill-opacity=".32" stroke="#5d675a" stroke-opacity=".24" stroke-width=".2">
    <ellipse cx="92" cy="4.65" rx="1.05" ry=".33"/>
    <ellipse cx="412" cy="4.65" rx="1.05" ry=".33"/>
  </g>
</svg>
