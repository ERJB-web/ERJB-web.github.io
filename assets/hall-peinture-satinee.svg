<svg xmlns="http://www.w3.org/2000/svg" width="192" height="256" viewBox="0 0 192 256" aria-hidden="true">
  <defs>
    <!-- Matériau peint micro-texturé, sans motifs géométriques répétitifs visibles. -->
    <filter id="peinture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".88 .71" numOctaves="3" seed="23" stitchTiles="stitch" result="pore"/>
      <feColorMatrix in="pore" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="surface">
        <feFuncR type="linear" slope=".66" intercept=".23"/>
        <feFuncG type="linear" slope=".66" intercept=".23"/>
        <feFuncB type="linear" slope=".66" intercept=".23"/>
        <feFuncA type="linear" slope=".075"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="fibres" x1="0" y1="0" x2="1" y2=".15">
      <stop stop-color="#77877d" stop-opacity="0"/>
      <stop offset=".55" stop-color="#77877d" stop-opacity=".12"/>
      <stop offset="1" stop-color="#77877d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="192" height="256" fill="#6a7569" filter="url(#peinture)"/>
  <!-- Irrégularités quasi imperceptibles du laquage au rouleau, non décoratives. -->
  <path d="M23 0l-.6 256M89 0l.9 256M144 0l-.5 256" stroke="url(#fibres)" stroke-width=".18"/>
  <path d="M0 67L192 66.6M0 183.4L192 183.1" stroke="#4b5b4e" opacity=".045" stroke-width=".25"/>
</svg>